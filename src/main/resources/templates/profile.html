<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Profile</title>

    <link rel="stylesheet" th:href="@{/css/css/style.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        SecureDocs
    </div>

    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/documents}">Documents</a>
        <a th:href="@{/profile}">Profile</a>
    </div>

</nav>

<section class="section">

    <h2 class="section-title">
        User Profile
    </h2>

    <div class="profile-card">

        <div class="profile-icon">
            <i class="fa-solid fa-user-circle fa-5x"></i>
        </div>

        <table class="profile-table">

            <tr>
                <td><strong>Username</strong></td>
                <td id="username">Loading...</td>
            </tr>

            <tr>
                <td><strong>Role</strong></td>
                <td id="role">Loading...</td>
            </tr>

            <tr>
                <td><strong>Authentication Method</strong></td>
                <td id="authentication">Loading...</td>
            </tr>

            <tr>
                <td><strong>Account Status</strong></td>
                <td>Active</td>
            </tr>

        </table>

        <br>

        <a th:href="@{/dashboard}" class="btn btn-primary">
            Back to Dashboard
        </a>

    </div>

</section>

<footer>

    © 2026 Secure Document Management System

</footer>

<script>

    fetch("/api/user")
        .then(response => response.json())
        .then(data => {

            document.getElementById("username").innerText = data.username;

            document.getElementById("role").innerText = data.role;

            document.getElementById("authentication").innerText = data.authentication;

        });

</script>

</body>

</html>
